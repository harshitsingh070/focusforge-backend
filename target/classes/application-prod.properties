# ============================================================================
# Production profile overrides (activate with SPRING_PROFILES_ACTIVE=prod on Render)
# ============================================================================

# Public base URL of this app so the keep-alive scheduler can ping itself.
# The /api/health path is derived automatically from server.servlet.context-path.
app.self-url=https://<my-render-app>.onrender.com

# Enables the self-ping keep-alive. The KeepAliveScheduler bean is only created
# when this is true AND the "prod" profile is active, so it never runs during
# local development or tests.
app.keep-alive.enabled=true
